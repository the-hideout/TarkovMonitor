name: Build Development Application

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # pin@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@8e6bd2905eef86446227f003dda1deb3916c4aaf # pin@v2
        with:
          dotnet-version: "6.x" # Change this to the desired .NET version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build and publish
        shell: pwsh
        run: |
          dotnet publish TarkovMonitor/TarkovMonitor.csproj `
            -c Release `
            --self-contained `
            --runtime win-x64 `
            -p:PublishSingleFile=true `
            --output "$Env:GITHUB_WORKSPACE\publish"

      - name: Verify published application
        shell: pwsh
        run: |
          $executable = "$Env:GITHUB_WORKSPACE\publish\TarkovMonitor.exe"

          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Published executable was not found: $executable"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pin@v4
        with:
          name: Published Application
          path: publish
          if-no-files-found: error

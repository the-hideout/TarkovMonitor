name: Build Development Application

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # pin@v6.0.0
        with:
          dotnet-version: "6.x" # Change this to the desired .NET version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build and publish
        shell: pwsh
        run: |
          dotnet publish TarkovMonitor/TarkovMonitor.csproj `
            -c Release `
            --self-contained `
            --runtime win-x64 `
            -p:PublishSingleFile=true `
            --output "$Env:GITHUB_WORKSPACE\publish"

      - name: Verify published application
        shell: pwsh
        run: |
          $executable = "$Env:GITHUB_WORKSPACE\publish\TarkovMonitor.exe"

          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Published executable was not found: $executable"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: Published Application
          path: publish
          if-no-files-found: error
